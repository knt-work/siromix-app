<script>

 const panels={

  grading:'<h2>Chấm bài trắc nghiệm</h2><div class="sm-sheet-line"><i data-lucide="calendar-days"></i>Năm học 2026 – 2027</div><div class="sm-sheet-line"><i data-lucide="layers"></i>Kì thi → Khối → Môn → Mã đề</div><div class="sm-sheet-line"><i data-lucide="scan-line"></i>Quét phiếu & chấm điểm</div>',
  results:'<h2>Sổ chấm bài</h2><div class="sm-sheet-line"><i data-lucide="search"></i>Tìm SBD, mã đề hoặc số bài</div><p class="sm-empty">Chưa có bài chấm được lưu.</p>',
  profile:'<h2>Hồ sơ & dữ liệu</h2><div class="sm-sheet-line"><i data-lucide="user-round"></i>Hồ sơ giáo viên</div><div class="sm-sheet-line"><i data-lucide="download"></i>Sao lưu & khôi phục</div><div class="sm-sheet-line"><i data-lucide="cloud-off"></i>Google / Apple · Chưa liên kết</div>'
 };
 root.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>{
   const phone=button.closest('.sm-phone');
   phone.querySelector('.sm-sheet-content').innerHTML=panels[button.dataset.open];
   phone.querySelector('.sm-sheet').hidden=false;
   phone.querySelector('.sm-close').focus();
   if(globalThis.lucide) lucide.createIcons({attrs:{width:20,height:20}});
   if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{screen:'SiroMix home mockup',style:phone.classList.contains('sm-mist')?'Xanh sương':'Cam bình minh',opened:button.dataset.open}}).catch(()=>{});
 }));
 root.querySelectorAll('.sm-close').forEach(button=>button.addEventListener('click',()=>{
   const phone=button.closest('.sm-phone');phone.querySelector('.sm-sheet').hidden=true;
   phone.querySelector('[data-open]').focus();
 }));
 const choices={};
 const saved=window.openai?.widgetState;
 const savedChoices=saved?.privateContent?.choices || saved?.choices || {};
 const persist=()=>{if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{screen:'SiroMix home mockup'},privateContent:{choices}}).catch(()=>{});};
 const renderers=[];
 root.querySelectorAll('.sm-phone').forEach((phone,i)=>{
   const stored=savedChoices[i]||{};
   const state={radius:Math.max(12,Math.min(36,Number(stored.radius)||20)),wallpaper:Math.max(40,Math.min(100,Number(stored.wallpaper)||100))}; choices[i]=state;
   const render=()=>{phone.style.setProperty('--sm-radius',state.radius+'px');phone.style.setProperty('--sm-wall-opacity',state.wallpaper/100);};
   renderers[i]=render;
   render();
   if(globalThis.Tweak){const t=new Tweak({container:phone,onChange:()=>{render();persist();}});t.addSlider(state,'radius',{label:'Bo góc thẻ chính',min:12,max:36,unit:'px'});t.addSlider(state,'wallpaper',{label:'Độ đậm wallpaper',min:40,max:100,unit:'%'});}
 });
 window.addEventListener('openai:set_globals',event=>{
   const snapshot=event.detail?.globals?.widgetState;
   const incoming=snapshot?.privateContent?.choices||snapshot?.choices;
   if(!incoming) return;
   Object.keys(choices).forEach(i=>{if(incoming[i]){choices[i].radius=Math.max(12,Math.min(36,Number(incoming[i].radius)||20));choices[i].wallpaper=Math.max(40,Math.min(100,Number(incoming[i].wallpaper)||100));renderers[i]();}});
 });
})();
</script>
